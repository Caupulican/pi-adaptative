name: Destructive suite

# Separate from ci.yml. The destructive suite (crash, chaos, stress, soak) was removed on 2026-10-04
# with the rest of the tests and is rebuilt by area from git history. The workflow stays so the
# release gate that requires a green run on the release SHA (release:promote, release provenance)
# keeps working; its job records that no suite ran instead of passing silently.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  destructive:
    name: test:destructive (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Record that no destructive suite exists
        shell: bash
        run: echo "No destructive suite is present; it is rebuilt by area from git history."
