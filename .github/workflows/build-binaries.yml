name: Build Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g., v0.12.0)'
        required: true
        type: string
      skip_windows_verify:
        description: Skip Windows RPC smoke; npm publish still requires the binary build
        required: false
        type: boolean
        default: false
      verify_only:
        description: Build and verify artifacts without creating a GitHub Release or publishing npm
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  quality-gate:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.event.inputs.tag || github.ref_name }}
      skip_tests: true

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
          registry-url: 'https://registry.npmjs.org'

      - name: Build binaries
        run: ./scripts/build-binaries.sh

      - name: Upload release binaries for platform verification
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-binaries
          path: packages/coding-agent/binaries/pi-*
          if-no-files-found: error
          retention-days: 7

  verify-windows-binary:
    name: Verify Windows binary (${{ matrix.arch }})
    if: github.event_name == 'push' || inputs.verify_only == true || inputs.skip_windows_verify != true
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    needs: build
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout benchmark harness
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'

      - name: Download release binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-binaries
          path: artifacts

      - name: Smoke test native Windows binary
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $arch = "${{ matrix.arch }}"
          $archive = Join-Path $PWD "artifacts\pi-windows-$arch.zip"
          $extractDir = Join-Path $env:RUNNER_TEMP "pi-adaptative\windows-$arch"
          $agentDir = Join-Path $env:RUNNER_TEMP "pi-adaptative\agent"
          New-Item -ItemType Directory -Force -Path $extractDir, $agentDir | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath $extractDir -Force
          $exe = Join-Path $extractDir "pi.exe"
          $env:PI_ADAPTATIVE_CODING_AGENT_DIR = $agentDir

          $required = @(
            "pi.exe",
            "collect-pi-incident.ps1",
            "native\win32\prebuilds\win32-$arch\win32-console-mode.node",
            "node_modules\@mariozechner\clipboard-win32-$arch-msvc"
          )
          foreach ($relativePath in $required) {
            if (-not (Test-Path (Join-Path $extractDir $relativePath))) {
              throw "Windows $arch archive is missing $relativePath"
            }
          }

          $incidentOutput = Join-Path $env:RUNNER_TEMP "pi-adaptative\incident-$arch"
          & (Join-Path $extractDir "collect-pi-incident.ps1") -AgentDir $agentDir -OutputDir $incidentOutput -EventHours 1
          $incidentArchives = @(Get-ChildItem -LiteralPath $incidentOutput -File -Filter "pi-incident-*.zip")
          if ($incidentArchives.Count -ne 1) {
            throw "Windows $arch incident collector did not create exactly one archive"
          }

          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "pi.exe --version failed with exit code $LASTEXITCODE" }
          & $exe --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "pi.exe --help failed with exit code $LASTEXITCODE" }
          & $exe --list-models | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "pi.exe --list-models failed with exit code $LASTEXITCODE" }

          $startInfo = [System.Diagnostics.ProcessStartInfo]::new()
          $startInfo.FileName = $exe
          $startInfo.UseShellExecute = $false
          $startInfo.RedirectStandardInput = $true
          $startInfo.RedirectStandardOutput = $true
          $startInfo.RedirectStandardError = $true
          foreach ($argument in @("--mode", "rpc", "--no-session", "--no-extensions")) {
            [void]$startInfo.ArgumentList.Add($argument)
          }
          $rpc = [System.Diagnostics.Process]::new()
          $rpc.StartInfo = $startInfo
          if (-not $rpc.Start()) { throw "Failed to start pi.exe RPC smoke" }

          function Read-RpcResponse([string]$id) {
            $deadline = [DateTime]::UtcNow.AddSeconds(30)
            while ([DateTime]::UtcNow -lt $deadline) {
              $remaining = [Math]::Max(1, [int]($deadline - [DateTime]::UtcNow).TotalMilliseconds)
              $lineTask = $rpc.StandardOutput.ReadLineAsync()
              if (-not $lineTask.Wait($remaining)) { throw "Timed out waiting for RPC response $id" }
              $line = $lineTask.Result
              if ($null -eq $line) {
                throw "pi.exe RPC closed before response ${id}: $($rpc.StandardError.ReadToEnd())"
              }
              $record = $line | ConvertFrom-Json
              if ($record.id -eq $id) { return $record }
            }
            throw "Timed out waiting for RPC response $id"
          }

          $rpc.StandardInput.WriteLine('{"id":"state","type":"get_state"}')
          $rpc.StandardInput.Flush()
          $state = Read-RpcResponse "state"
          if (-not $state.success) { throw "RPC get_state did not return a successful response" }

          $rpc.StandardInput.WriteLine('{"id":"shell","type":"bash","command":"echo windows-rpc-ok"}')
          $rpc.StandardInput.Flush()
          $shell = Read-RpcResponse "shell"
          if (-not $shell.success -or $shell.data.exitCode -ne 0 -or $shell.data.output -notmatch "windows-rpc-ok") {
            throw "RPC bash contract did not execute successfully through PowerShell: $($shell | ConvertTo-Json -Compress -Depth 8)"
          }

          $rpc.StandardInput.Close()
          if (-not $rpc.WaitForExit(30000)) {
            $rpc.Kill($true)
            throw "pi.exe RPC did not exit after stdin closed"
          }
          if ($rpc.ExitCode -ne 0) { throw "pi.exe RPC smoke failed with exit code $($rpc.ExitCode)" }

          $benchmarkOutput = Join-Path $PWD "pi-windows-${{ matrix.arch }}-benchmark.json"
          node scripts/release-binary-rpc-benchmark.mjs `
            --binary $exe `
            --samples 3 `
            --warm-iterations 5 `
            --warmup-samples 1 `
            --label "windows-$arch" `
            --output $benchmarkOutput
          if ($LASTEXITCODE -ne 0) { throw "Windows $arch binary benchmark failed with exit code $LASTEXITCODE" }

      - name: Upload Windows binary benchmark
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-binary-benchmark-windows-${{ matrix.arch }}
          path: pi-windows-${{ matrix.arch }}-benchmark.json
          if-no-files-found: error
          retention-days: 7

  benchmark-linux-binary:
    name: Benchmark Linux binary (x64)
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout benchmark harness
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'

      - name: Download release binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-binaries
          path: artifacts

      - name: Benchmark native Linux binary
        env:
          PI_ADAPTATIVE_CODING_AGENT_DIR: ${{ runner.temp }}/pi-adaptative/agent
        run: |
          extract_dir="${RUNNER_TEMP}/pi-adaptative/linux-x64"
          mkdir -p "${extract_dir}" "${PI_ADAPTATIVE_CODING_AGENT_DIR}"
          tar -xzf artifacts/pi-linux-x64.tar.gz -C "${extract_dir}"
          node scripts/release-binary-rpc-benchmark.mjs \
            --binary "${extract_dir}/pi" \
            --samples 3 \
            --warm-iterations 5 \
            --warmup-samples 1 \
            --label linux-x64 \
            --output pi-linux-x64-benchmark.json

      - name: Upload Linux binary benchmark
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-binary-benchmark-linux-x64
          path: pi-linux-x64-benchmark.json
          if-no-files-found: error
          retention-days: 7

  release:
    if: github.event_name == 'push' || inputs.verify_only != true
    runs-on: ubuntu-latest
    # Binary build is the publish gate. Windows RPC smoke is extra product
    # verification and must not block npm after a green test SHA.
    needs: [quality-gate, build]
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Download verified release binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-binaries
          path: packages/coding-agent/binaries

      - name: Extract changelog for this version
        run: |
          VERSION="${RELEASE_TAG#v}"
          WORK_DIR="${RUNNER_TEMP}/pi-adaptative/release"
          NOTES_FILE="${WORK_DIR}/release-notes.md"
          mkdir -p "${WORK_DIR}"
          awk "/^## \[${VERSION}\]/{flag=1; next} /^## \[/{flag=0} flag" packages/coding-agent/CHANGELOG.md > "${NOTES_FILE}"
          if [ ! -s "${NOTES_FILE}" ]; then
            echo "::error::No changelog entry found for ${VERSION} in packages/coding-agent/CHANGELOG.md; refusing to publish a release with placeholder notes." >&2
            exit 1
          fi

      - name: Create GitHub Release and upload verified binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BINARIES_DIR="packages/coding-agent/binaries"
          NOTES_FILE="${RUNNER_TEMP}/pi-adaptative/release/release-notes.md"
          gh release create "${RELEASE_TAG}" \
            --title "${RELEASE_TAG}" \
            --notes-file "${NOTES_FILE}" \
            "${BINARIES_DIR}/pi-darwin-arm64.tar.gz" \
            "${BINARIES_DIR}/pi-darwin-x64.tar.gz" \
            "${BINARIES_DIR}/pi-linux-x64.tar.gz" \
            "${BINARIES_DIR}/pi-linux-arm64.tar.gz" \
            "${BINARIES_DIR}/pi-windows-x64.zip" \
            "${BINARIES_DIR}/pi-windows-arm64.zip" \
            2>/dev/null || \
          gh release upload "${RELEASE_TAG}" \
            "${BINARIES_DIR}/pi-darwin-arm64.tar.gz" \
            "${BINARIES_DIR}/pi-darwin-x64.tar.gz" \
            "${BINARIES_DIR}/pi-linux-x64.tar.gz" \
            "${BINARIES_DIR}/pi-linux-arm64.tar.gz" \
            "${BINARIES_DIR}/pi-windows-x64.zip" \
            "${BINARIES_DIR}/pi-windows-arm64.zip" \
            --clobber

  publish-npm:
    runs-on: ubuntu-latest
    # The binary build is a mandatory release gate: packages publish to npm only
    # after the cross-platform binaries build successfully, so a broken build
    # never ships a release. quality-gate (ci.yml) already ran check+test on this
    # exact ref, so this job only rebuilds the npm publish artifacts (dist/, which
    # is gitignored and not shared between jobs) and verifies their integrity -
    # it does not re-run lint/typecheck/tests, so a flake there can no longer
    # leave a public GitHub release with no matching npm packages.
    needs: release
    # Override the top-level contents:write — this job only needs to read the
    # repo and mint an OIDC token for npm provenance attestations.
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -s $(which fdfind) /usr/local/bin/fd

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify native TypeScript test toolchain
        run: |
          npm ls vite@8.2.0 vitest@4.1.10 --depth=0
          node node_modules/vitest/vitest.mjs --version
          node node_modules/vite/bin/vite.js --version

      - name: Build
        # Deterministic CI: builds are hermetic by default (see
        # packages/ai/scripts/model-catalog-generation-policy.ts) and use the COMMITTED model
        # catalogs instead of refetching live pricing that can drift between the release commit
        # and this run (drift would otherwise fail the artifact verification below and abort the
        # npm publish). Live refresh only happens when PI_FETCH_MODELS=1 is explicitly set, which
        # this job never does.
        run: npm run build

      - name: Verify release artifacts are committed
        # Artifact-integrity check: the build above must be a pure function of the checked-out
        # release commit. Any tracked file it touches (e.g. a generated catalog) that doesn't
        # match what's committed means the tagged release and the published npm packages would
        # diverge from source control - fail before publishing rather than after.
        run: git diff --exit-code

      - name: Publish npm packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/publish.mjs
