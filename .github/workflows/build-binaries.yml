name: Build Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g., v0.12.0)'
        required: true
        type: string
      skip_windows_verify:
        description: Skip Windows RPC/performance verification; GitHub release publication remains blocked
        required: false
        type: boolean
        default: false
      verify_only:
        description: Build and verify artifacts without creating a GitHub Release
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  quality-gate:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.event.inputs.tag || github.ref_name }}
      skip_tests: true

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'

      - name: Build binaries
        run: ./scripts/build-binaries.sh

      - name: Verify pinned native toolchain
        run: npm ls vite@8.2.1 vitest@4.1.10 --depth=0

      - name: Verify Linux standalone installer
        run: |
          fixture_dir="${RUNNER_TEMP}/pi-adaptative/linux-installer-fixture"
          install_dir="${RUNNER_TEMP}/pi-adaptative/linux-installer-root"
          bin_dir="${RUNNER_TEMP}/pi-adaptative/linux-installer-bin"
          mkdir -p "${fixture_dir}"
          cp packages/coding-agent/binaries/pi-linux-x64.tar.gz "${fixture_dir}/"
          (
            cd "${fixture_dir}"
            sha256sum pi-linux-x64.tar.gz > SHA256SUMS
          )
          PI_VERSION="${RELEASE_TAG}" \
          PI_INSTALL_DIR="${install_dir}" \
          PI_BIN_DIR="${bin_dir}" \
          PI_INSTALL_TEST_MODE=1 \
          PI_INSTALL_TEST_BASE_URL="${fixture_dir}" \
            ./install.sh
          test "$("${bin_dir}/pi" --version)" = "${RELEASE_TAG#v}"
          test -x "${install_dir}/current/pi"
          test -s "${install_dir}/current/package.json"

      - name: Verify Linux arm64 release layout
        run: |
          extract_dir="${RUNNER_TEMP}/pi-adaptative/linux-arm64-layout"
          mkdir -p "${extract_dir}"
          tar -xzf packages/coding-agent/binaries/pi-linux-arm64.tar.gz \
            -C "${extract_dir}" \
            --strip-components=1
          test -x "${extract_dir}/pi"
          test -s "${extract_dir}/package.json"
          readelf -h "${extract_dir}/pi" | grep -Eq 'Machine:[[:space:]]+AArch64'

      - name: Upload release binaries for platform verification
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-binaries
          path: packages/coding-agent/binaries/pi-*
          if-no-files-found: error
          retention-days: 7

  verify-windows-binary:
    name: Verify Windows binary (${{ matrix.arch }})
    if: github.event_name == 'push' || inputs.verify_only == true || inputs.skip_windows_verify != true
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    needs: build
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout benchmark harness
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'

      - name: Download release binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-binaries
          path: artifacts

      - name: Verify Windows standalone installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $arch = "${{ matrix.arch }}"
          $assetName = "pi-windows-$arch.zip"
          $archive = Join-Path $PWD "artifacts\$assetName"
          $fixtureDir = Join-Path $env:RUNNER_TEMP "pi-adaptative\windows-installer-fixture-$arch"
          $installDir = Join-Path $env:RUNNER_TEMP "pi-adaptative\windows-installer-root-$arch"
          $binDir = Join-Path $env:RUNNER_TEMP "pi-adaptative\windows-installer-bin-$arch"
          New-Item -ItemType Directory -Force -Path $fixtureDir | Out-Null
          Copy-Item -LiteralPath $archive -Destination (Join-Path $fixtureDir $assetName)
          $digest = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText(
            (Join-Path $fixtureDir "SHA256SUMS"),
            "$digest  $assetName`n",
            [System.Text.UTF8Encoding]::new($false)
          )

          $env:PI_VERSION = $env:RELEASE_TAG
          $env:PI_INSTALL_DIR = $installDir
          $env:PI_BIN_DIR = $binDir
          $env:PI_INSTALL_TEST_MODE = "1"
          $env:PI_INSTALL_TEST_BASE_URL = $fixtureDir
          $env:PI_INSTALL_TEST_SKIP_PATH = "1"
          & (Join-Path $PWD "install.ps1")

          $pointer = Join-Path $installDir "current.version"
          if ((Get-Content -LiteralPath $pointer -Raw).Trim() -ne $env:RELEASE_TAG) {
            throw "Windows $arch installer did not activate $env:RELEASE_TAG"
          }
          $launcher = Join-Path $binDir "pi.cmd"
          $installedVersion = (& $launcher --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $installedVersion -ne $env:RELEASE_TAG.Substring(1)) {
            throw "Windows $arch installed launcher reported '$installedVersion'"
          }
          $releaseDir = Join-Path (Join-Path $installDir "releases") $env:RELEASE_TAG
          if (-not (Test-Path -LiteralPath (Join-Path $releaseDir "collect-pi-incident.ps1") -PathType Leaf)) {
            throw "Windows $arch installer did not retain the complete release tree"
          }

          $env:PI_VERSION = "v999.0.0"
          $rejected = $false
          try {
            & (Join-Path $PWD "install.ps1")
          } catch {
            $rejected = $true
          }
          if (-not $rejected) { throw "Windows $arch installer accepted an archive with the wrong version" }
          if ((Get-Content -LiteralPath $pointer -Raw).Trim() -ne $env:RELEASE_TAG) {
            throw "Windows $arch failed upgrade changed current.version"
          }

      - name: Smoke test native Windows binary
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $arch = "${{ matrix.arch }}"
          $archive = Join-Path $PWD "artifacts\pi-windows-$arch.zip"
          $extractDir = Join-Path $env:RUNNER_TEMP "pi-adaptative\windows-$arch"
          $agentDir = Join-Path $env:RUNNER_TEMP "pi-adaptative\agent"
          New-Item -ItemType Directory -Force -Path $extractDir, $agentDir | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath $extractDir -Force
          $exe = Join-Path $extractDir "pi.exe"
          $env:PI_ADAPTATIVE_CODING_AGENT_DIR = $agentDir

          $required = @(
            "pi.exe",
            "collect-pi-incident.ps1",
            "native\win32\prebuilds\win32-$arch\win32-console-mode.node",
            "node_modules\@mariozechner\clipboard-win32-$arch-msvc"
          )
          foreach ($relativePath in $required) {
            if (-not (Test-Path (Join-Path $extractDir $relativePath))) {
              throw "Windows $arch archive is missing $relativePath"
            }
          }

          $incidentOutput = Join-Path $env:RUNNER_TEMP "pi-adaptative\incident-$arch"
          & (Join-Path $extractDir "collect-pi-incident.ps1") -AgentDir $agentDir -OutputDir $incidentOutput -EventHours 1
          $incidentArchives = @(Get-ChildItem -LiteralPath $incidentOutput -File -Filter "pi-incident-*.zip")
          if ($incidentArchives.Count -ne 1) {
            throw "Windows $arch incident collector did not create exactly one archive"
          }

          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "pi.exe --version failed with exit code $LASTEXITCODE" }
          & $exe --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "pi.exe --help failed with exit code $LASTEXITCODE" }
          & $exe --list-models | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "pi.exe --list-models failed with exit code $LASTEXITCODE" }

          $startInfo = [System.Diagnostics.ProcessStartInfo]::new()
          $startInfo.FileName = $exe
          $startInfo.UseShellExecute = $false
          $startInfo.RedirectStandardInput = $true
          $startInfo.RedirectStandardOutput = $true
          $startInfo.RedirectStandardError = $true
          foreach ($argument in @("--mode", "rpc", "--no-session", "--no-extensions")) {
            [void]$startInfo.ArgumentList.Add($argument)
          }
          $rpc = [System.Diagnostics.Process]::new()
          $rpc.StartInfo = $startInfo
          if (-not $rpc.Start()) { throw "Failed to start pi.exe RPC smoke" }

          function Read-RpcResponse([string]$id) {
            $deadline = [DateTime]::UtcNow.AddSeconds(30)
            while ([DateTime]::UtcNow -lt $deadline) {
              $remaining = [Math]::Max(1, [int]($deadline - [DateTime]::UtcNow).TotalMilliseconds)
              $lineTask = $rpc.StandardOutput.ReadLineAsync()
              if (-not $lineTask.Wait($remaining)) { throw "Timed out waiting for RPC response $id" }
              $line = $lineTask.Result
              if ($null -eq $line) {
                throw "pi.exe RPC closed before response ${id}: $($rpc.StandardError.ReadToEnd())"
              }
              $record = $line | ConvertFrom-Json
              if ($record.id -eq $id) { return $record }
            }
            throw "Timed out waiting for RPC response $id"
          }

          $rpc.StandardInput.WriteLine('{"id":"state","type":"get_state"}')
          $rpc.StandardInput.Flush()
          $state = Read-RpcResponse "state"
          if (-not $state.success) { throw "RPC get_state did not return a successful response" }

          $rpc.StandardInput.WriteLine('{"id":"shell","type":"bash","command":"echo windows-rpc-ok"}')
          $rpc.StandardInput.Flush()
          $shell = Read-RpcResponse "shell"
          if (-not $shell.success -or $shell.data.exitCode -ne 0 -or $shell.data.output -notmatch "windows-rpc-ok") {
            throw "RPC bash contract did not execute successfully through PowerShell: $($shell | ConvertTo-Json -Compress -Depth 8)"
          }

          $rpc.StandardInput.Close()
          if (-not $rpc.WaitForExit(30000)) {
            $rpc.Kill($true)
            throw "pi.exe RPC did not exit after stdin closed"
          }
          if ($rpc.ExitCode -ne 0) { throw "pi.exe RPC smoke failed with exit code $($rpc.ExitCode)" }

          $benchmarkOutput = Join-Path $PWD "pi-windows-${{ matrix.arch }}-benchmark.json"
          node scripts/release-binary-rpc-benchmark.mjs `
            --binary $exe `
            --samples 5 `
            --warm-iterations 10 `
            --warmup-samples 1 `
            --label "windows-$arch" `
            --output $benchmarkOutput
          if ($LASTEXITCODE -ne 0) { throw "Windows $arch binary benchmark failed with exit code $LASTEXITCODE" }

      - name: Upload Windows binary benchmark
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-binary-benchmark-windows-${{ matrix.arch }}
          path: pi-windows-${{ matrix.arch }}-benchmark.json
          if-no-files-found: error
          retention-days: 7

  benchmark-linux-binary:
    name: Benchmark Linux binary (x64)
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout benchmark harness
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'

      - name: Download release binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-binaries
          path: artifacts

      - name: Benchmark native Linux binary
        env:
          PI_ADAPTATIVE_CODING_AGENT_DIR: ${{ runner.temp }}/pi-adaptative/agent
        run: |
          extract_dir="${RUNNER_TEMP}/pi-adaptative/linux-x64"
          mkdir -p "${extract_dir}" "${PI_ADAPTATIVE_CODING_AGENT_DIR}"
          tar -xzf artifacts/pi-linux-x64.tar.gz -C "${extract_dir}" --strip-components=1
          node scripts/release-binary-rpc-benchmark.mjs \
            --binary "${extract_dir}/pi" \
            --samples 5 \
            --warm-iterations 10 \
            --warmup-samples 1 \
            --label linux-x64 \
            --output pi-linux-x64-benchmark.json

      - name: Upload Linux binary benchmark
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-binary-benchmark-linux-x64
          path: pi-linux-x64-benchmark.json
          if-no-files-found: error
          retention-days: 7

  verify-release-binary-performance:
    name: Gate native Windows binary performance
    if: github.event_name == 'push' || inputs.verify_only == true || inputs.skip_windows_verify != true
    runs-on: ubuntu-latest
    needs: [benchmark-linux-binary, verify-windows-binary]
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout performance gate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'

      - name: Download platform benchmarks
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-binary-benchmark-*
          path: benchmarks
          merge-multiple: true

      - name: Enforce Windows performance budgets
        run: |
          node scripts/release-binary-performance-gate.mjs \
            --linux benchmarks/pi-linux-x64-benchmark.json \
            --windows benchmarks/pi-windows-x64-benchmark.json \
            --windows benchmarks/pi-windows-arm64-benchmark.json \
            --output release-binary-performance.json

      - name: Upload performance gate report
        if: success() || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-binary-performance
          path: release-binary-performance.json
          if-no-files-found: warn
          retention-days: 30

  release-provenance:
    name: Verify exact-commit release provenance
    if: github.event_name == 'push' || inputs.verify_only != true
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout release ref
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require successful CI and destructive evidence for the release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_sha="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          release_subject="$(git show -s --format=%s "$release_sha")"

          # Release/repair commits contain version and changelog metadata only. Their
          # parent is the immutable tree that release.mjs required the complete CI
          # matrix to prove before it created that metadata commit.
          tested_sha="$release_sha"
          case "$release_subject" in
            "Release v"*|"Repair release v"*)
              tested_sha="$(git rev-parse "${release_sha}^")"
              node scripts/verify-release-metadata-diff.mjs "$tested_sha" "$release_sha" ;;
          esac

          successful_run_ids() {
            workflow="$1"
            sha="$2"
            gh run list \
              --repo "${GITHUB_REPOSITORY}" \
              --workflow "$workflow" \
              --commit "$sha" \
              --limit 100 \
              --json databaseId,headSha,status,conclusion |
              jq --arg sha "$sha" -r '.[] | select(.headSha == $sha and .status == "completed" and .conclusion == "success") | .databaseId'
          }

          verify_workflow() {
            workflow="$1"
            sha="$2"
            if [ -z "$(successful_run_ids "$workflow" "$sha")" ]; then
              echo "::error::${workflow} has no successful completed run for exact commit ${sha}" >&2
              exit 1
            fi
          }

          verify_full_ci() {
            sha="$1"
            run_ids="$(successful_run_ids ci.yml "$sha")"
            for run_id in $run_ids; do
              jobs="$(gh run view "$run_id" --repo "${GITHUB_REPOSITORY}" --json jobs)"
              linux_quality="$(
                printf '%s' "$jobs" | jq '[.jobs[] | select(
                  .name == "Build, check, test (ubuntu-latest)" and
                  .status == "completed" and .conclusion == "success" and
                  any(.steps[]; .name == "Verification-harness coverage gate" and .conclusion == "success") and
                  any(.steps[]; .name == "Test non-coding-agent workspaces" and .conclusion == "success")
                )] | length'
              )"
              windows_quality="$(
                printf '%s' "$jobs" | jq '[.jobs[] | select(
                  .name == "Build, check, test (windows-latest)" and
                  .status == "completed" and .conclusion == "success" and
                  any(.steps[]; .name == "Test non-coding-agent workspaces" and .conclusion == "success") and
                  any(.steps[]; .name == "Test native incident collector with Windows PowerShell 5.1" and .conclusion == "success")
                )] | length'
              )"
              coding_shards="$(
                printf '%s' "$jobs" | jq '[.jobs[] | select(
                  (.name | startswith("Coding-agent test (")) and
                  .status == "completed" and .conclusion == "success" and
                  any(.steps[]; .name == "Test coding-agent shard" and .conclusion == "success")
                )] | length'
              )"
              if [ "$linux_quality" -eq 1 ] && [ "$windows_quality" -eq 1 ] && [ "$coding_shards" -eq 8 ]; then
                return 0
              fi
            done
            echo "::error::ci.yml has no successful complete Linux/Windows matrix for tested commit ${sha}" >&2
            exit 1
          }

          verify_full_ci "$tested_sha"
          verify_workflow destructive.yml "$release_sha"

  release:
    if: github.event_name == 'push' || inputs.verify_only != true
    runs-on: ubuntu-latest
    # GitHub release publication stays blocked until both native Windows binaries pass
    # functional RPC smoke and absolute startup/warm-path budgets. Linux-relative
    # ratios remain in the report as cross-runner performance telemetry.
    needs: [quality-gate, build, release-provenance, verify-release-binary-performance]
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Download verified release binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-binaries
          path: packages/coding-agent/binaries

      - name: Extract changelog for this version
        run: |
          VERSION="${RELEASE_TAG#v}"
          WORK_DIR="${RUNNER_TEMP}/pi-adaptative/release"
          NOTES_FILE="${WORK_DIR}/release-notes.md"
          mkdir -p "${WORK_DIR}"
          awk "/^## \[${VERSION}\]/{flag=1; next} /^## \[/{flag=0} flag" packages/coding-agent/CHANGELOG.md > "${NOTES_FILE}"
          if [ ! -s "${NOTES_FILE}" ]; then
            echo "::error::No changelog entry found for ${VERSION} in packages/coding-agent/CHANGELOG.md; refusing to publish a release with placeholder notes." >&2
            exit 1
          fi

      - name: Prepare standalone release installer and checksums
        run: |
          BINARIES_DIR="packages/coding-agent/binaries"
          test -s install.sh
          test -s install.ps1
          chmod +x install.sh
          cp install.sh "${BINARIES_DIR}/install.sh"
          cp install.ps1 "${BINARIES_DIR}/install.ps1"
          (
            cd "${BINARIES_DIR}"
            sha256sum \
              install.sh \
              install.ps1 \
              pi-darwin-arm64.tar.gz \
              pi-darwin-x64.tar.gz \
              pi-linux-x64.tar.gz \
              pi-linux-arm64.tar.gz \
              pi-windows-x64.zip \
              pi-windows-arm64.zip \
              > SHA256SUMS
          )

      - name: Create GitHub Release and upload verified binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BINARIES_DIR="packages/coding-agent/binaries"
          NOTES_FILE="${RUNNER_TEMP}/pi-adaptative/release/release-notes.md"
          gh release create "${RELEASE_TAG}" \
            --title "${RELEASE_TAG}" \
            --notes-file "${NOTES_FILE}" \
            "${BINARIES_DIR}/pi-darwin-arm64.tar.gz" \
            "${BINARIES_DIR}/pi-darwin-x64.tar.gz" \
            "${BINARIES_DIR}/pi-linux-x64.tar.gz" \
            "${BINARIES_DIR}/pi-linux-arm64.tar.gz" \
            "${BINARIES_DIR}/pi-windows-x64.zip" \
            "${BINARIES_DIR}/pi-windows-arm64.zip" \
            "${BINARIES_DIR}/install.sh" \
            "${BINARIES_DIR}/install.ps1" \
            "${BINARIES_DIR}/SHA256SUMS" \
            2>/dev/null || \
          gh release upload "${RELEASE_TAG}" \
            "${BINARIES_DIR}/pi-darwin-arm64.tar.gz" \
            "${BINARIES_DIR}/pi-darwin-x64.tar.gz" \
            "${BINARIES_DIR}/pi-linux-x64.tar.gz" \
            "${BINARIES_DIR}/pi-linux-arm64.tar.gz" \
            "${BINARIES_DIR}/pi-windows-x64.zip" \
            "${BINARIES_DIR}/pi-windows-arm64.zip" \
            "${BINARIES_DIR}/install.sh" \
            "${BINARIES_DIR}/install.ps1" \
            "${BINARIES_DIR}/SHA256SUMS" \
            --clobber
