name: Release

# Runs scripts/release.mjs on GitHub instead of a local checkout. The script stays the one owner of the
# release rules: the version bump and changelogs, `npm run check`, then the version tag; the tag's
# quality-gate is the one full ci.yml run of the release commit. This workflow only supplies the runner, the credentials, the
# restart after a lost push race and the hand-off to build-binaries.yml.
#
# One dispatch is the whole release and needs no attendance. It does not freeze main: commits pushed while it
# runs are not in this release and are not disturbed by it. The job stays alive until build-binaries.yml has
# published the assets, so a red run here always means the release is not out.
#
# Pushes made with the workflow token never trigger other workflows, so the tag this job creates does not
# start build-binaries.yml by itself; this job dispatches it on the tag.
#
# Targets:
#   patch | minor | major  prepare the next version from main, then promote it
#   promote                resume a prepared release whose gate or tag step did not finish
#   repair                 re-run a prepared, untagged release after a corrected gate failure
# Never run patch/minor/major again for a version whose release commit is already pushed.

on:
  workflow_dispatch:
    inputs:
      target:
        description: Release target
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - promote
          - repair
        default: patch

permissions:
  contents: write # push the release commits and the version tag
  actions: write # dispatch build-binaries.yml

# One release at a time; a running release is never cancelled halfway through its pushes.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release (${{ inputs.target }})
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TARGET: ${{ inputs.target }}
    steps:
      # The script reads origin/main, the tags and the release history, so it needs the whole of it.
      - name: Checkout main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          fetch-depth: 0

      - name: Set the release commit author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install Linux system dependencies
        run: ./scripts/install-linux-ci-deps.sh

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify TypeScript compiler selection
        run: |
          npm ls typescript@7.0.2 tsrs@0.18.0-ts7.1.0-dev.20260929 --depth=0
          node scripts/run-tsc.mjs --version

      # Same hermetic build ci.yml runs before its static check: the committed model catalogs, no live refresh.
      - name: Build
        run: npm run build

      # Exit 75 means origin/main moved while the release was prepared and its push was refused with nothing
      # published. The release is a pure function of the tree, so it starts again from the new tip.
      - name: Run the release
        run: |
          for attempt in 1 2 3 4 5; do
            rc=0
            node scripts/release.mjs "${RELEASE_TARGET}" || rc=$?
            if [ "${rc}" -eq 0 ]; then exit 0; fi
            if [ "${rc}" -ne 75 ]; then exit "${rc}"; fi
            echo "::notice::main moved during the release (attempt ${attempt}); starting again from the new tip."
            git fetch origin main
            git reset --hard origin/main
            npm ci --ignore-scripts
          done
          echo "::error::main moved during every one of 5 release attempts; nothing was published. Dispatch again." >&2
          exit 1

      - name: Publish the release assets from the tag
        run: |
          VERSION="$(node -p "require('./packages/ai/package.json').version")"
          TAG="v${VERSION}"
          if ! git ls-remote --exit-code --tags origin "refs/tags/${TAG}" > /dev/null; then
            echo "::error::${TAG} is not on origin; the release did not reach its tag, so there is nothing to publish." >&2
            exit 1
          fi
          # A run already building or already succeeded for this tag is not started twice. A failed or cancelled
          # one is replaced, which is how an asset failure is retried.
          live_or_green='[.[] | select(.status != "completed" or .conclusion == "success")]'
          current="$(gh run list --workflow=build-binaries.yml --branch "${TAG}" --json status,conclusion \
            --jq "${live_or_green} | length")"
          if [ "${current}" != "0" ]; then
            echo "build-binaries.yml already has a live or successful run for ${TAG}; not starting another."
          else
            gh workflow run build-binaries.yml --ref "${TAG}" -f tag="${TAG}"
            echo "Dispatched build-binaries.yml on ${TAG}."
          fi
          # The dispatch registers asynchronously; wait for the run, then follow it to its end so this job's
          # verdict is the release's verdict.
          run_id=""
          for _ in $(seq 1 30); do
            run_id="$(gh run list --workflow=build-binaries.yml --branch "${TAG}" --json databaseId,status,conclusion \
              --jq "${live_or_green} | .[0].databaseId // empty")"
            if [ -n "${run_id}" ]; then break; fi
            sleep 10
          done
          if [ -z "${run_id}" ]; then
            echo "::error::No build-binaries.yml run appeared for ${TAG}." >&2
            exit 1
          fi
          {
            echo "### ${TAG}"
            echo
            echo "Tagged. The standalone archives are built, verified and published by the Build Binaries workflow:"
            echo "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
          } >> "${GITHUB_STEP_SUMMARY}"
          gh run watch "${run_id}" --exit-status --interval 30
