name: Profile

# A monitor, not a gate. Fired on demand to see where the harness's CPU goes on long sessions and
# per turn, across the whole system: the coding-agent host driving a real session, the agent-core
# loop, and process startup -- on Linux and on Windows, each reported on its own. It never fails
# the build; growth beyond the advisory thresholds surfaces as warning annotations, and every raw
# .cpuprofile plus the ranked self-time tables are published as artifacts and in the job summary
# so the next target is explicit per platform.
#
# Read the results with scripts/analyze-cpuprofile.mjs (self time by function and file) and
# scripts/report-long-session-growth.mjs (per-turn cost by session decile); see
# packages/coding-agent/docs/profiling-long-sessions.md.

on:
  workflow_dispatch:
    inputs:
      host_turns:
        description: Tool turns for the host long-session profile
        default: '1500'
        type: string
      loop_turns:
        description: Scripted tool-call turns for the agent-core per-turn profile
        default: '600'
        type: string
      tools_turns:
        description: Tool turns for the bash/grep/read host scenario
        default: '400'
        type: string
      delegate_turns:
        description: Tool turns for the delegation host scenario (one worker per 30 turns)
        default: '600'
        type: string

permissions:
  contents: read

jobs:
  profile:
    # Both platforms, separately: a hot path that is cheap on Linux can be the top row on Windows
    # (filesystem metadata and process CPU accounting differ), so each gets its own tables and
    # artifact to pinpoint against.
    name: Profile (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      PROFILE_DIR: ${{ github.workspace }}/profiles
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
          cache: npm

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: ./scripts/install-linux-ci-deps.sh

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Prepare profile directories
        run: mkdir -p "$PROFILE_DIR/host/goal" "$PROFILE_DIR/host/tools" "$PROFILE_DIR/host/delegate" "$PROFILE_DIR/agent-core" "$PROFILE_DIR/startup"

      # Three host scenarios, each a real AgentSession over the faux provider: the goal mix that
      # dominates real sessions, a bash/grep/read mix that runs the tool-output reducers on every
      # call, and the goal mix with an in-process worker delegation every 30 turns.
      - name: Host long-session profile (goal mix)
        working-directory: packages/coding-agent
        env:
          NODE_OPTIONS: --conditions=pi-source
          PI_PROFILE_LONG_SESSION: '1'
          PI_PROFILE_SCENARIO: goal
          PI_PROFILE_TURNS: ${{ inputs.host_turns }}
          PI_PROFILE_DIR: ${{ env.PROFILE_DIR }}/host/goal
        run: npx vitest run test/profiling/host-long-session.profile.test.ts --pool=forks || echo "::warning title=Host profile (goal)::the host long-session profile reported a failure; read the artifact"

      - name: Host long-session profile (tools mix)
        working-directory: packages/coding-agent
        env:
          NODE_OPTIONS: --conditions=pi-source
          PI_PROFILE_LONG_SESSION: '1'
          PI_PROFILE_SCENARIO: tools
          PI_PROFILE_TURNS: ${{ inputs.tools_turns }}
          PI_PROFILE_DIR: ${{ env.PROFILE_DIR }}/host/tools
        run: npx vitest run test/profiling/host-long-session.profile.test.ts --pool=forks || echo "::warning title=Host profile (tools)::the host long-session profile reported a failure; read the artifact"

      - name: Host long-session profile (delegation mix)
        working-directory: packages/coding-agent
        env:
          NODE_OPTIONS: --conditions=pi-source
          PI_PROFILE_LONG_SESSION: '1'
          PI_PROFILE_SCENARIO: delegate
          PI_PROFILE_TURNS: ${{ inputs.delegate_turns }}
          PI_PROFILE_DIR: ${{ env.PROFILE_DIR }}/host/delegate
        run: npx vitest run test/profiling/host-long-session.profile.test.ts --pool=forks || echo "::warning title=Host profile (delegate)::the host long-session profile reported a failure; read the artifact"

      - name: Agent-core per-turn profile (stub provider stream)
        run: node scripts/profile-coding-agent-turn.mjs --turns ${{ inputs.loop_turns }} --profile-dir "$PROFILE_DIR/agent-core" --label turn-profile | tee "$PROFILE_DIR/agent-core/turn-profile.txt"

      - name: Startup profile
        run: node scripts/profile-coding-agent-node.mjs --mode rpc --cpu-profile --profile-dir "$PROFILE_DIR/startup" | tee "$PROFILE_DIR/startup/startup.txt" || echo "::warning title=Startup profile::the startup profiler reported a failure; read the artifact"

      - name: Summarize
        # Never fails: an instrument that produced nothing is reported as missing, not as an error,
        # so the other instruments' tables still land in the summary.
        run: |
          shopt -s nullglob
          {
            echo "## ${{ matrix.os }}"
            echo
            for scenario in goal tools delegate; do
              echo "## Long-session growth (host, $scenario mix)"
              # The pressure file (host-session-pressure.txt, memory/disk/CPU/process sampling
              # from the same run) is optional here only for defensiveness -- the test always
              # writes it alongside host-session-profile.txt -- and folds its rss/heapUsed
              # growth table plus totals line into this same report, never failing the job.
              if [ -f "$PROFILE_DIR/host/$scenario/host-session-profile.txt" ]; then
                if [ -f "$PROFILE_DIR/host/$scenario/host-session-pressure.txt" ]; then
                  node scripts/report-long-session-growth.mjs "$PROFILE_DIR/host/$scenario/host-session-profile.txt" "$PROFILE_DIR/host/$scenario/host-session-pressure.txt"
                else
                  node scripts/report-long-session-growth.mjs "$PROFILE_DIR/host/$scenario/host-session-profile.txt"
                  echo "::warning title=Host pressure ($scenario)::no host-session-pressure.txt was produced"
                fi
                if [ -f "$PROFILE_DIR/host/$scenario/host-session-cache.txt" ]; then
                  echo; echo "#### prompt-cache reuse ($scenario)"; echo '```'
                  cat "$PROFILE_DIR/host/$scenario/host-session-cache.txt"
                  echo '```'
                fi
              else
                echo "::warning title=Host profile ($scenario)::no host-session-profile.txt was produced"
              fi
              echo
              echo "## Host self time ($scenario mix)"
              if [ -f "$PROFILE_DIR/host/$scenario/host-session.cpuprofile" ]; then
                node scripts/analyze-cpuprofile.mjs "$PROFILE_DIR/host/$scenario/host-session.cpuprofile" --top 30 --title "host long-session, $scenario mix"
              else
                echo "(no host .cpuprofile was produced)"
              fi
              echo
            done
            echo "## Agent-core per-turn self time"
            for f in "$PROFILE_DIR"/agent-core/*.cpuprofile; do node scripts/analyze-cpuprofile.mjs "$f" --top 30 --title "agent-core per-turn (${{ inputs.loop_turns }} turns)"; done
            echo
            echo "## Agent-core turn durations by decile"
            echo '```'
            cat "$PROFILE_DIR/agent-core/turn-profile.txt" 2>/dev/null || echo "(no turn-profile.txt was produced)"
            echo '```'
            echo
            echo "## Startup self time"
            for f in "$PROFILE_DIR"/startup/*.cpuprofile; do node scripts/analyze-cpuprofile.mjs "$f" --top 25 --title "startup $(basename "$f")"; done
          } | tee -a "$GITHUB_STEP_SUMMARY" || true

      - name: Upload profiles
        # profiles/** already covers host-session-pressure.txt and .json: the test writes them into
        # the same PI_PROFILE_DIR as host-session-profile.txt and the .cpuprofile.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cpu-profiles-${{ matrix.os }}-${{ github.run_id }}
          path: profiles/**
          retention-days: 30
