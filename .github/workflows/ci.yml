name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: Exact commit or tag to validate
        required: false
        type: string
      skip_tests:
        description: Skip tests; exact-preflight-HEAD GitHub CI already passed the complete suite
        required: false
        type: boolean
        default: false

concurrency:
  # PR updates cancel the previous PR run. Pushes use the commit SHA so a later
  # main commit (the post-release [Unreleased] section) cannot cancel CI on the
  # Release vX.Y.Z commit that promote polls.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  build-check-test:
    name: Build, check, test (${{ matrix.os }})
    strategy:
      fail-fast: false
      # Job-level `if` cannot see `matrix` (evaluated before expansion). Compute
      # the OS list instead: skip Windows when tests are already proven.
      matrix:
        os: ${{ fromJSON((inputs.skip_tests || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release v'))) && '["ubuntu-latest"]' || '["ubuntu-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    # Includes hosted-runner package-manager variance plus bounded execution; tests remain separately sharded below.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
          cache: npm

      - name: Install Linux system dependencies
        if: >
          runner.os == 'Linux' &&
          inputs.skip_tests != true &&
          (github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Release v'))
        run: ./scripts/install-linux-ci-deps.sh

      - name: Install Windows system dependencies
        if: >
          runner.os == 'Windows' &&
          inputs.skip_tests != true &&
          (github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Release v'))
        shell: pwsh
        run: |
          choco install fd --version=10.4.2 --yes --no-progress
          fd --version

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify native TypeScript test toolchain
        run: |
          npm ls vite@8.2.1 vitest@4.1.10 --depth=0
          node node_modules/vitest/vitest.mjs --version
          node node_modules/vite/bin/vite.js --version

      - name: Build
        # Deterministic CI: builds are hermetic by default (see
        # packages/ai/scripts/model-catalog-generation-policy.ts) and use the COMMITTED model
        # catalogs instead of refetching live pricing that can drift between the release commit
        # and this run (drift fails the artifact verification and aborts the release). Live
        # refresh only happens when PI_FETCH_MODELS=1 is explicitly set, which this job never does.
        run: npm run build

      - name: Check
        run: npm run check

      # A contract test may change only alongside docs/doctrine.md (see contracts.json). The
      # pre-commit chain checks the staged tree; a push is checked over its commit range.
      - name: Contract-doctrine gate
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: node scripts/check-contract-doctrine.mjs --range ${{ github.event.before }}..${{ github.sha }}

      - name: Verification-harness coverage gate
        if: >
          runner.os == 'Linux' &&
          inputs.skip_tests != true &&
          (github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Release v'))
        run: npm run coverage:verification-harness

      # Contract gate: a short goal session must stay append-only (reuse p50 >= 0.98, appends >= 95%)
      # with flat per-request host work. Two seconds; the full Profile workflow stays on demand.
      - name: Long-session contract gate
        if: >
          inputs.skip_tests != true &&
          (github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Release v'))
        working-directory: packages/coding-agent
        env:
          PI_PROFILE_LONG_SESSION: '1'
          PI_PROFILE_SCENARIO: goal
          PI_PROFILE_TURNS: '300'
          PI_PROFILE_GATE: '1'
          PI_PROFILE_DIR: ${{ runner.temp }}/profile-gate
        run: npx vitest run test/profiling/host-long-session.profile.test.ts --pool=forks

      - name: Test non-coding-agent workspaces
        if: >
          inputs.skip_tests != true &&
          (github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Release v'))
        env:
          NODE_OPTIONS: --conditions=pi-source
        run: npm test -- packages/tui packages/ai packages/agent

      - name: Test native incident collector with Windows PowerShell 5.1
        if: >
          runner.os == 'Windows' &&
          inputs.skip_tests != true &&
          (github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Release v'))
        shell: pwsh
        working-directory: packages/coding-agent
        env:
          NODE_OPTIONS: --conditions=pi-source
        run: |
          $env:PI_TEST_POWERSHELL = Join-Path $env:SystemRoot "System32\WindowsPowerShell\v1.0\powershell.exe"
          node ../../node_modules/vitest/dist/cli.js --run test/windows-incident-collector.test.ts

  coding-agent-test:
    name: Coding-agent test (${{ matrix.os }}, shard ${{ matrix.shard }}/4)
    if: >
      inputs.skip_tests != true &&
      (github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Release v'))
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        shard: [1, 2, 3, 4]
    runs-on: ${{ matrix.os }}
    # Includes hosted-runner package-manager variance plus bounded execution.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
          cache: npm

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: ./scripts/install-linux-ci-deps.sh

      - name: Install Windows system dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install fd --version=10.4.2 --yes --no-progress
          fd --version

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify native TypeScript test toolchain
        run: |
          npm ls vite@8.2.1 vitest@4.1.10 --depth=0
          node node_modules/vitest/vitest.mjs --version
          node node_modules/vite/bin/vite.js --version

      - name: Build
        run: npm run build

      - name: Test coding-agent shard
        working-directory: packages/coding-agent
        env:
          NODE_OPTIONS: --conditions=pi-source
        run: node ../../node_modules/vitest/dist/cli.js --run --bail=1 --shard=${{ matrix.shard }}/4
