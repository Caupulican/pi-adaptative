name: CI

# Push/PR run only the tests that commit actually touched. The complete
# Linux/Windows matrix is the release tag (build-binaries.yml quality-gate)
# and manual dispatch.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact commit or tag to validate
        required: false
        type: string

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan affected tests
    runs-on: ubuntu-latest
    outputs:
      quality_job: ${{ steps.plan.outputs.quality_job }}
      check: ${{ steps.plan.outputs.check }}
      coding_agent: ${{ steps.plan.outputs.coding_agent }}
      os: ${{ steps.plan.outputs.os }}
      non_coding_agent_workspaces: ${{ steps.plan.outputs.non_coding_agent_workspaces }}
      coverage: ${{ steps.plan.outputs.coverage }}
      long_session: ${{ steps.plan.outputs.long_session }}
      native_process: ${{ steps.plan.outputs.native_process }}
      windows_incident: ${{ steps.plan.outputs.windows_incident }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Plan
        id: plan
        env:
          CI_FULL_SUITE: ${{ github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch' }}
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BEFORE: ${{ github.event.before }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_COMMIT_SUBJECT: ${{ github.event.head_commit.message || github.event.pull_request.title }}
        run: node scripts/ci-affected.mjs

  build-check-test:
    name: Build, check, test (${{ matrix.os }})
    needs: plan
    if: needs.plan.outputs.quality_job == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.os) }}
    runs-on: ${{ matrix.os }}
    # Includes hosted-runner package-manager variance plus bounded execution; tests remain separately sharded below.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: ./scripts/install-linux-ci-deps.sh

      - name: Install Windows system dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Chocolatey's community feed is the first source; when it is unreachable (it was, on
          # 2026-09-10, for every Windows job of one run) the pinned release archive from GitHub is
          # the second, so a feed outage never decides a CI result.
          $version = "10.4.2"
          $installed = $false
          try {
            choco install fd --version=$version --yes --no-progress
            $installed = ($LASTEXITCODE -eq 0)
          } catch { $installed = $false }
          if (-not $installed) {
            Write-Host "choco install fd failed; installing fd $version from the GitHub release archive"
            $dir = Join-Path $env:RUNNER_TEMP "fd-$version"
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            $archive = Join-Path $dir "fd.zip"
            Invoke-WebRequest -Uri "https://github.com/sharkdp/fd/releases/download/v$version/fd-v$version-x86_64-pc-windows-msvc.zip" -OutFile $archive
            Expand-Archive -Path $archive -DestinationPath $dir -Force
            $exe = Get-ChildItem -Path $dir -Recurse -Filter fd.exe | Select-Object -First 1
            if (-not $exe) { throw "fd.exe not found in the release archive" }
            Add-Content -Path $env:GITHUB_PATH -Value $exe.DirectoryName
            $env:PATH = "$($exe.DirectoryName);$env:PATH"
          }
          fd --version

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify native TypeScript test toolchain
        run: |
          npm ls vite@8.2.2 vitest@5.0.0 --depth=0
          node node_modules/vitest/vitest.mjs --version
          node node_modules/vite/bin/vite.js --version

      - name: Build
        if: >
          needs.plan.outputs.non_coding_agent_workspaces != '[]' ||
          needs.plan.outputs.coding_agent == 'true'
        # Deterministic CI: builds are hermetic by default (see
        # packages/ai/scripts/model-catalog-generation-policy.ts) and use the COMMITTED model
        # catalogs instead of refetching live pricing that can drift between the release commit
        # and this run (drift fails the artifact verification and aborts the release). Live
        # refresh only happens when PI_FETCH_MODELS=1 is explicitly set, which this job never does.
        run: npm run build

      - name: Check
        if: >
          runner.os == 'Linux' &&
          needs.plan.outputs.check == 'true'
        run: npm run check

      # A contract test may change only alongside docs/doctrine.md (see contracts.json). The
      # pre-commit chain checks the staged tree; a push is checked over its commit range.
      - name: Contract-doctrine gate
        if: runner.os == 'Linux'
        shell: bash
        env:
          CI_BEFORE: ${{ github.event.before }}
          CI_EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$CI_EVENT_NAME" = "push" ] && [ -n "$CI_BEFORE" ] && [ "$CI_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            if git fetch --no-tags --depth=1 origin "$CI_BEFORE"; then
              node scripts/check-contract-doctrine.mjs --range "$CI_BEFORE..${{ github.sha }}"
              exit $?
            fi
          fi
          git fetch --no-tags --deepen=1 origin
          node scripts/check-contract-doctrine.mjs --range "HEAD~1..HEAD"

      - name: Verification-harness coverage gate
        if: >
          runner.os == 'Linux' &&
          needs.plan.outputs.coverage == 'true'
        run: npm run coverage:verification-harness

      # Contract gate: a short goal session must stay append-only (reuse p50 >= 0.98, appends >= 95%)
      # with flat per-request host work. Two seconds; the full Profile workflow stays on demand.
      - name: Long-session contract gate
        if: needs.plan.outputs.long_session == 'true'
        working-directory: packages/coding-agent
        env:
          PI_PROFILE_LONG_SESSION: '1'
          PI_PROFILE_SCENARIO: goal
          PI_PROFILE_TURNS: '300'
          PI_PROFILE_GATE: '1'
          PI_PROFILE_DIR: ${{ runner.temp }}/profile-gate
        run: npx vitest run test/profiling/host-long-session.profile.test.ts --pool=forks

      - name: Test non-coding-agent workspaces
        if: needs.plan.outputs.non_coding_agent_workspaces != '[]'
        env:
          NODE_OPTIONS: --conditions=pi-source
          PI_VITEST_ISOLATE_NATIVE_PROCESS: "1"
        run: npm test -- ${{ join(fromJSON(needs.plan.outputs.non_coding_agent_workspaces), ' ') }}

      # This is native OS success control, not a resource-contention test. Keep the same assertions
      # on both platforms after parallel CPU/memory benchmarks; timeout refusal remains unit-tested.
      - name: Test native process-tree control alone
        if: needs.plan.outputs.native_process == 'true'
        working-directory: packages/agent
        env:
          NODE_OPTIONS: --conditions=pi-source
        run: node ../../node_modules/vitest/dist/cli.js --run --bail=0 test/reliability/process-tree-native-tree.test.ts

      - name: Test native incident collector with Windows PowerShell 5.1
        if: >
          runner.os == 'Windows' &&
          needs.plan.outputs.windows_incident == 'true'
        shell: pwsh
        working-directory: packages/coding-agent
        env:
          NODE_OPTIONS: --conditions=pi-source
        run: |
          $env:PI_TEST_POWERSHELL = Join-Path $env:SystemRoot "System32\WindowsPowerShell\v1.0\powershell.exe"
          node ../../node_modules/vitest/dist/cli.js --run test/windows-incident-collector.test.ts

  coding-agent-test:
    name: Coding-agent test (${{ matrix.os }}, shard ${{ matrix.shard }}/4)
    needs: plan
    if: needs.plan.outputs.coding_agent == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        shard: [1, 2, 3, 4]
    runs-on: ${{ matrix.os }}
    # Includes hosted-runner package-manager variance plus bounded execution.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: ./scripts/install-linux-ci-deps.sh

      - name: Install Windows system dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Chocolatey's community feed is the first source; when it is unreachable (it was, on
          # 2026-09-10, for every Windows job of one run) the pinned release archive from GitHub is
          # the second, so a feed outage never decides a CI result.
          $version = "10.4.2"
          $installed = $false
          try {
            choco install fd --version=$version --yes --no-progress
            $installed = ($LASTEXITCODE -eq 0)
          } catch { $installed = $false }
          if (-not $installed) {
            Write-Host "choco install fd failed; installing fd $version from the GitHub release archive"
            $dir = Join-Path $env:RUNNER_TEMP "fd-$version"
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            $archive = Join-Path $dir "fd.zip"
            Invoke-WebRequest -Uri "https://github.com/sharkdp/fd/releases/download/v$version/fd-v$version-x86_64-pc-windows-msvc.zip" -OutFile $archive
            Expand-Archive -Path $archive -DestinationPath $dir -Force
            $exe = Get-ChildItem -Path $dir -Recurse -Filter fd.exe | Select-Object -First 1
            if (-not $exe) { throw "fd.exe not found in the release archive" }
            Add-Content -Path $env:GITHUB_PATH -Value $exe.DirectoryName
            $env:PATH = "$($exe.DirectoryName);$env:PATH"
          }
          fd --version

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify native TypeScript test toolchain
        run: |
          npm ls vite@8.2.2 vitest@5.0.0 --depth=0
          node node_modules/vitest/vitest.mjs --version
          node node_modules/vite/bin/vite.js --version

      - name: Build
        run: npm run build

      # The Windows shell corpus wall runs for over a minute on Windows and shares a shard with
      # tests holding second-scale budgets; three of those failed on time alone while it ran
      # beside them (2026-09-12). It is excluded from every shard and run by itself, after shard
      # 1's own tests have finished, so no budgeted test ever competes with it for the runner.
      - name: Test coding-agent shard
        working-directory: packages/coding-agent
        env:
          NODE_OPTIONS: --conditions=pi-source
          PI_VITEST_ISOLATE_CORPUS: "1"
        # --bail=0 on the shard: every failure in the shard is reported in one run. With --bail=1
        # each red shard showed exactly one failure and the next push found the next one
        # (2026-09-12: two candidates, nine red jobs each, seven distinct causes). The local
        # inner loop keeps its own defaults (package.json `test` still bails).
        run: node ../../node_modules/vitest/dist/cli.js --run --bail=0 --shard=${{ matrix.shard }}/4

      - name: Test the Windows shell corpus wall alone
        if: matrix.shard == 1
        working-directory: packages/coding-agent
        env:
          NODE_OPTIONS: --conditions=pi-source
        run: node ../../node_modules/vitest/dist/cli.js --run --bail=1 test/windows-shell-corpus.test.ts
