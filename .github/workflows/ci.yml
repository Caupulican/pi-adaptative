name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: Exact commit or tag to validate
        required: false
        type: string

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-check-test:
    name: Build, check, test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
          cache: npm

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -s $(which fdfind) /usr/local/bin/fd

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        # Deterministic CI: use the COMMITTED model catalogs instead of refetching live pricing
        # that can drift between the release commit and this run (drift fails the artifact
        # verification and aborts the npm publish).
        env:
          PI_SKIP_MODEL_FETCH: "1"
        run: npm run build

      - name: Check
        run: npm run check

      - name: Test
        run: npm test

      - name: Test native incident collector with Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: packages/coding-agent
        run: |
          $env:PI_TEST_POWERSHELL = Join-Path $env:SystemRoot "System32\WindowsPowerShell\v1.0\powershell.exe"
          node ../../node_modules/vitest/dist/cli.js --run test/windows-incident-collector.test.ts
