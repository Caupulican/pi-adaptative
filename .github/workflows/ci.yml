name: CI

# Build and check on Linux and Windows. The test suite was removed on 2026-10-04 and is rebuilt by
# area from git history, so there is no test planning, sharding or carry-forward here; the
# release tag runs the same jobs (build-binaries.yml quality-gate) and release-ci-proof.mjs
# requires them by name.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact commit or tag to validate
        required: false
        type: string
      full_suite:
        description: Kept for callers; build and check always run in full
        required: false
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  build-check:
    # `label` is the stable job name scripts/release-ci-proof.mjs requires; `os` is the runner image. The Linux image
    # is pinned: the standalone Linux binaries are built here, and a moving `ubuntu-latest` raises their glibc floor
    # when GitHub migrates the label.
    name: Build, check (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: ubuntu-latest
          - os: windows-latest
            label: windows-latest
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: ./scripts/install-linux-ci-deps.sh

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify native TypeScript toolchain
        run: |
          npm ls vite@8.2.2 vitest@5.0.1 --depth=0
          node node_modules/vitest/vitest.mjs --version
          node node_modules/vite/bin/vite.js --version

      # Deterministic CI: builds are hermetic by default (see
      # packages/ai/scripts/model-catalog-generation-policy.ts) and use the COMMITTED model
      # catalogs instead of refetching live pricing that can drift between the release commit
      # and this run (drift fails the artifact verification and aborts the release). Live
      # refresh only happens when PI_FETCH_MODELS=1 is explicitly set, which this job never does.
      - name: Build
        run: npm run build

      - name: Check
        if: runner.os == 'Linux'
        run: npm run check

      # A contract test may change only alongside docs/doctrine.md (see contracts.json). The
      # pre-commit chain checks the staged tree; a push is checked over its commit range.
      - name: Contract-doctrine gate
        if: runner.os == 'Linux'
        shell: bash
        env:
          CI_BEFORE: ${{ github.event.before }}
          CI_EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$CI_EVENT_NAME" = "push" ] && [ -n "$CI_BEFORE" ] && [ "$CI_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            if git fetch --no-tags --depth=1 origin "$CI_BEFORE"; then
              node scripts/check-contract-doctrine.mjs --range "$CI_BEFORE..${{ github.sha }}"
              exit $?
            fi
          fi
          git fetch --no-tags --deepen=1 origin
          node scripts/check-contract-doctrine.mjs --range "HEAD~1..HEAD"
