name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: Exact commit or tag to validate
        required: false
        type: string
      skip_tests:
        description: Skip npm test; local ./test.sh and HEAD CI already passed
        required: false
        type: boolean
        default: false

concurrency:
  # PR updates cancel the previous PR run. Pushes use the commit SHA so a later
  # main commit (the post-release [Unreleased] section) cannot cancel CI on the
  # Release vX.Y.Z commit that promote polls.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  build-check-test:
    name: Build, check, test (${{ matrix.os }})
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
    # Release commits already paid for local ./test.sh and a green HEAD CI. Do not
    # buy a Windows runner just to rebuild version metadata.
    if: >
      matrix.os == 'ubuntu-latest' ||
      (inputs.skip_tests != true &&
      (github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Release v')))
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
          cache: npm

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -s $(which fdfind) /usr/local/bin/fd

      - name: Install Windows system dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install fd --version=10.4.2 --yes --no-progress
          fd --version

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify native TypeScript test toolchain
        run: |
          npm ls vite@8.2.0 vitest@4.1.10 --depth=0
          node node_modules/vitest/vitest.mjs --version
          node node_modules/vite/bin/vite.js --version

      - name: Build
        # Deterministic CI: builds are hermetic by default (see
        # packages/ai/scripts/model-catalog-generation-policy.ts) and use the COMMITTED model
        # catalogs instead of refetching live pricing that can drift between the release commit
        # and this run (drift fails the artifact verification and aborts the npm publish). Live
        # refresh only happens when PI_FETCH_MODELS=1 is explicitly set, which this job never does.
        run: npm run build

      - name: Check
        run: npm run check

      - name: Test
        if: >
          inputs.skip_tests != true &&
          (github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Release v'))
        env:
          NODE_OPTIONS: --conditions=pi-source
        run: npm test

      - name: Test native incident collector with Windows PowerShell 5.1
        if: >
          runner.os == 'Windows' &&
          inputs.skip_tests != true &&
          (github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Release v'))
        shell: pwsh
        working-directory: packages/coding-agent
        env:
          NODE_OPTIONS: --conditions=pi-source
        run: |
          $env:PI_TEST_POWERSHELL = Join-Path $env:SystemRoot "System32\WindowsPowerShell\v1.0\powershell.exe"
          node ../../node_modules/vitest/dist/cli.js --run test/windows-incident-collector.test.ts
